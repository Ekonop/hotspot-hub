<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Hotspot Hub app icon: hub node broadcasting. Deep slate tile so it reads
       on both light and dark trays; the live status dot is overlaid at
       bottom-right by the app (make_status_icon). -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#26334f"/>
      <stop offset="1" stop-color="#0f1626"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.09"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="arc" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#f2f6fc"/>
      <stop offset="1" stop-color="#b9c9e2"/>
    </linearGradient>
  </defs>

  <!-- Tile -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="15" fill="url(#tile)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="15" fill="url(#sheen)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="15" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5"/>

  <!-- Broadcast arcs (hub node at 32,47.5; arcs open upward, sweep=0) -->
  <g fill="none" stroke="url(#arc)" stroke-linecap="round">
    <path d="M13.98 34.89 A 22 22 0 0 0 50.02 34.89" stroke-width="5"   opacity="0.55"/>
    <path d="M20.53 39.47 A 14 14 0 0 0 43.47 39.47" stroke-width="5"   opacity="0.80"/>
    <path d="M26.27 43.48 A 7 7 0 0 0 37.73 43.48"   stroke-width="4.5" opacity="1"/>
  </g>

  <!-- Hub node -->
  <circle cx="32" cy="47.5" r="4.6" fill="#eef3fa"/>
  <circle cx="32" cy="47.5" r="2.1" fill="#38bdf8"/>
</svg>