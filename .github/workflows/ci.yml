name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system libraries for PyQt6
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 \
            libfontconfig1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xfixes0 libxcb-xinerama0

      - name: Install ruff and PyQt6
        run: pip install ruff PyQt6

      - name: Ruff lint
        run: ruff check app/ cli/ tests/

      - name: Syntax check
        run: |
          python3 -c "import ast; ast.parse(open('app/hotspot-hub.py').read())"
          python3 -c "import ast; ast.parse(open('cli/hotspot-hub-cli.py').read())"

      - name: Unit tests
        run: python3 -m unittest discover -s tests -v

  validate-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate shell scripts
        run: |
          bash -n install.sh
          bash -n uninstall.sh
          for f in helpers/*.sh src/*.sh src/90-hotspot-channelsync scripts/*.sh; do
            if [ -f "$f" ]; then
              echo "Checking $f"
              bash -n "$f"
            fi
          done
