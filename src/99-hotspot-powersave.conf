# Hotspot Hub — Wi-Fi power-save off for the STA uplink (single-radio concurrency).
# MediaTek MT7922 (mt7921e) clients left in 802.11 power-save can drop the uplink
# or miss DHCP/ARP renewals, surfacing as "limited connectivity" on the laptop and
# for hotspot clients. 2 = disable (NetworkManager default is 3 = enabled).
# Installed by install.sh to /etc/NetworkManager/conf.d/99-hotspot-powersave.conf
[connection]
wifi.powersave = 2
