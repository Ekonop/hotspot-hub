<svg xmlns="http://www.w3.org/2000/svg" width="320" height="160" viewBox="0 0 320 160">
  <!-- Empty-state illustration for the Clients dialog: a quiet device with
       dashed (silent) arcs = no clients yet. Muted, theme-neutral palette. -->
  <defs>
    <linearGradient id="arcg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c8aa5"/>
      <stop offset="1" stop-color="#5c6b85"/>
    </linearGradient>
  </defs>

  <circle cx="95" cy="112" r="56" fill="#38bdf8" fill-opacity="0.06"/>

  <!-- Device -->
  <rect x="74" y="52" width="32" height="58" rx="9" fill="none"
        stroke="#7c8aa5" stroke-width="4" stroke-opacity="0.9"/>
  <line x1="82" y1="66" x2="98" y2="66" stroke="#7c8aa5" stroke-width="3" stroke-opacity="0.4" stroke-linecap="round"/>
  <circle cx="90" cy="98" r="2.4" fill="#7c8aa5" fill-opacity="0.55"/>

  <!-- Dashed arcs: awaiting clients -->
  <g fill="none" stroke="url(#arcg)" stroke-linecap="round" stroke-dasharray="5 7">
    <path d="M53.3 59.0 A 38 38 0 0 0 124.7 59.0" stroke-width="4" opacity="0.45"/>
    <path d="M64.6 63.1 A 26 26 0 0 0 113.4 63.1" stroke-width="4" opacity="0.45"/>
    <path d="M75.8 67.2 A 14 14 0 0 0 102.2 67.2" stroke-width="4" opacity="0.45"/>
  </g>
</svg>